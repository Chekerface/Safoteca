# Publica la carpeta web/ en GitHub Pages cada vez que cambia en la rama main.
# Requiere activar una vez: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publicar web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que config.js y los datos no están rotos
        run: |
          node --check web/config.js
          node --check web/js/app.js
          python3 -c "import json; json.load(open('web/data/obras.json', encoding='utf-8'))"
      - name: Añadir la versión de pruebas (rama uat) en /uat/
        run: |
          if git ls-remote --exit-code --heads origin uat >/dev/null 2>&1; then
            git fetch --depth=1 origin uat
            mkdir -p /tmp/uat
            git archive FETCH_HEAD web | tar -x -C /tmp/uat
            node --check /tmp/uat/web/js/app.js
            mkdir -p web/uat
            cp -r /tmp/uat/web/. web/uat/
            rm -f web/uat/robots.txt web/uat/sitemap.xml
            python3 tools/generar_paginas.py --web web/uat --noindex
            echo "Versión de pruebas añadida en /uat/"
          else
            echo "No hay rama uat: se publica solo la web normal"
          fi
      - name: robots.txt, sitemap.xml y páginas por obra para buscadores (PRE no se indexa)
        run: |
          { echo "User-agent: *"; [ -d web/uat ] && echo "Disallow: /uat/"; echo ""; echo "Sitemap: https://www.lasafoteca.com/sitemap.xml"; } > web/robots.txt
          python3 - <<'PY'
          import json
          fecha = json.load(open("web/data/obras.json", encoding="utf-8"))["meta"]["generado"][:10]
          urls = [("https://www.lasafoteca.com/", fecha)]
          with open("web/sitemap.xml", "w", encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n')
              for u, d in urls:
                  f.write(f"  <url><loc>{u}</loc><lastmod>{d}</lastmod></url>\n")
              f.write("</urlset>\n")
          print(f"sitemap.xml: {len(urls)} direcciones")
          PY
          python3 tools/generar_paginas.py --web web --sitemap web/sitemap.xml
          cat web/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
