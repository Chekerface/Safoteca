<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Safoteca</title>
  <meta name="description" content="Series y películas con representación lésbica y bisexual, con avisos de contenido para que decidas qué quieres ver.">
  <meta name="theme-color" content="#fbf9fe" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16131d" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="marca/buholira.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/temas.css">
  <script src="config.js"></script>
  <script src="js/temas.js"></script>
</head>
<body>
  <a class="saltar" href="#vista">Saltar al contenido</a>

  <header class="cabecera" id="cabecera">
    <button class="cabecera__boton" id="btn-izq" type="button" aria-label="Ajustes"></button>
    <p class="cabecera__titulo" id="titulo-vista">La Safoteca</p>
    <button class="cabecera__boton" id="btn-filtros" type="button" aria-label="Filtros y avisos a evitar" hidden></button>
  </header>

  <main class="vista" id="vista" tabindex="-1">
    <p class="cargando">Cargando el catálogo…</p>
  </main>

  <nav class="tabs" aria-label="Principal" id="tabs"></nav>

  <dialog class="hoja" id="hoja" aria-labelledby="hoja-titulo"></dialog>
  <div class="aviso-flotante" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="cargando">La Safoteca necesita JavaScript para mostrar el catálogo.</p></noscript>
  <script src="js/app.js"></script>
</body>
</html>
